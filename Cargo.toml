[package]
name = "splayer-lyrics"
version = "1.1.0"
edition = "2021"
license = "MIT"
description = "A lightweight desktop lyrics overlay for SPlayer-Next on niri/Wayland"
repository = "https://github.com/wangoutlook/splayer-lyrics"
readme = "README.md"
keywords = ["lyrics", "wayland", "niri", "splayer", "overlay"]
categories = ["multimedia", "gui"]

[dependencies]
gtk4 = { version = "0.11", features = ["v4_10"] }
gtk4-layer-shell = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false }
anyhow = "1"
pangocairo = "0.22"
pango = "0.22"
cairo-rs = "0.22"
ksni = { version = "0.3.7", features = ["blocking"] }
